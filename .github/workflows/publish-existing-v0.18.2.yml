name: Publish existing v0.18.2

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-existing-v0.18.2.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: v0.18.2
          fetch-depth: 0

      - name: Download exact-tag release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=37854964727
          gh run download "$RUN_ID" -n release-linux-x86_64 -D release-input/linux
          gh run download "$RUN_ID" -n release-windows-x86_64 -D release-input/windows
          gh run download "$RUN_ID" -n release-macos-x86_64 -D release-input/macos

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.18.2
          mkdir -p release-assets
          cp "release-input/linux/garlicoin-${VERSION}-linux-x86_64.tar.gz" release-assets/
          cp "release-input/linux/garlicoin-${VERSION}.tar.gz" release-assets/
          cp "release-input/windows/garlicoin-${VERSION}-win64.zip" release-assets/
          cp "release-input/windows/garlicoin-${VERSION}-win64-setup.exe" release-assets/
          cp "release-input/macos/garlicoin-${VERSION}-osx64.tar.gz" release-assets/
          cp "release-input/macos/garlicoin-${VERSION}-osx64.dmg" release-assets/
          (
            cd release-assets
            sha256sum garlicoin-* | sort -k2 > SHA256SUMS
          )
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 7
          rm -rf /tmp/grlc-release-check
          mkdir -p /tmp/grlc-release-check
          tar -xzf "release-assets/garlicoin-${VERSION}-linux-x86_64.tar.gz" -C /tmp/grlc-release-check
          FIRST_LINE="$(/tmp/grlc-release-check/garlicoin-${VERSION}/bin/garlicoind --version | head -n1)"
          echo "$FIRST_LINE"
          case "$FIRST_LINE" in
            "Garlicoin Core Daemon version v${VERSION}"*) ;;
            *) exit 1 ;;
          esac
          (cd release-assets && sha256sum -c SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.18.2
          TITLE='Garlicoin Core 0.18.2 - GRLC.eu Maintenance Release'
          NOTES='doc/release-notes-0.18.2.md'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "$TITLE" --notes-file "$NOTES"
          fi
