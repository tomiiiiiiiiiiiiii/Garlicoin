name: Release Validation CI

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/release-validation-ci.yml'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'build-aux/**'
      - 'depends/**'
      - 'share/**'
      - 'contrib/macdeploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: '0.18.0'
  MAKEJOBS: -j2
  GARLICOIN_SCRYPT: '1'

jobs:
  linux-release:
    name: Linux x86_64 release package
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      HOST: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev bsdmainutils build-essential \
            ca-certificates ccache curl file git libtool pkg-config python3

      - name: Cache Linux depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-release-linux-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-release-linux-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic Linux dependencies
        run: make ${MAKEJOBS} -C depends HOST="${HOST}"

      - name: Configure and build Linux release
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --prefix=/ \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench
          make ${MAKEJOBS}

      - name: Validate Linux install and ELF binaries
        run: |
          rm -rf release-stage release-package artifacts
          mkdir -p release-stage release-package/garlicoin-${VERSION} artifacts
          make install-strip DESTDIR="$PWD/release-stage"
          for binary in garlicoind garlicoin-cli garlicoin-qt; do
            test -f "release-stage/bin/${binary}"
            file "release-stage/bin/${binary}" | tee "/tmp/${binary}.file"
            grep -q 'ELF 64-bit LSB' "/tmp/${binary}.file"
            grep -q 'x86-64' "/tmp/${binary}.file"
          done
          cp -a release-stage/. "release-package/garlicoin-${VERSION}/"
          cp README.md "release-package/garlicoin-${VERSION}/"
          tar -C release-package -czf "artifacts/garlicoin-${VERSION}-linux-x86_64.tar.gz" "garlicoin-${VERSION}"

      - name: Validate source distribution
        run: |
          make dist
          test -f "garlicoin-${VERSION}.tar.gz"
          tar -tzf "garlicoin-${VERSION}.tar.gz" >/tmp/source-manifest.txt
          grep -q "garlicoin-${VERSION}/configure" /tmp/source-manifest.txt
          grep -q "garlicoin-${VERSION}/src/validation.cpp" /tmp/source-manifest.txt
          cp "garlicoin-${VERSION}.tar.gz" artifacts/

      - name: Hash Linux artifacts
        run: |
          cd artifacts
          sha256sum * | tee SHA256SUMS

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  windows-release:
    name: Windows x86_64 release package
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      HOST: x86_64-w64-mingw32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev bsdmainutils build-essential \
            ca-certificates ccache curl file g++-mingw-w64-x86-64 git gperf \
            libtool mingw-w64-tools nsis patch perl pkg-config python3 zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Cache Windows depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-release-windows-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-release-windows-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic Windows dependencies
        run: make ${MAKEJOBS} -C depends HOST="${HOST}"

      - name: Configure and build Windows release
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --prefix=/ \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench
          make ${MAKEJOBS}

      - name: Validate Windows install and PE64 binaries
        run: |
          rm -rf release-stage release-package artifacts
          mkdir -p release-stage release-package/garlicoin-${VERSION} artifacts
          make install DESTDIR="$PWD/release-stage"
          for binary in garlicoind.exe garlicoin-cli.exe garlicoin-qt.exe; do
            test -f "release-stage/bin/${binary}"
            description="$(file "release-stage/bin/${binary}")"
            echo "$description"
            case "$description" in
              *"PE32+ executable"*"x86-64"*"MS Windows"*) ;;
              *) exit 1 ;;
            esac
            x86_64-w64-mingw32-objdump -f "release-stage/bin/${binary}" | grep -q 'file format pei-x86-64'
          done
          cp -a release-stage/. "release-package/garlicoin-${VERSION}/"
          cp README.md "release-package/garlicoin-${VERSION}/"
          cd release-package
          zip -X -r "../artifacts/garlicoin-${VERSION}-win64.zip" "garlicoin-${VERSION}"

      - name: Build and validate Windows installer
        run: |
          make deploy
          installer="$(find . -maxdepth 1 -type f -name 'garlicoin-*-win64-setup.exe' -print -quit)"
          test -n "$installer"
          file "$installer"
          cp "$installer" artifacts/

      - name: Hash Windows artifacts
        run: |
          cd artifacts
          sha256sum * | tee SHA256SUMS

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: artifacts/
          if-no-files-found: error

  macos-release:
    name: macOS x86_64 release package
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      HOST: x86_64-apple-darwin14
      OSX_SDK_VERSION: '10.11'
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Darwin release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev bsdmainutils build-essential \
            ca-certificates ccache clang cmake curl file git imagemagick \
            libbz2-dev libcap-dev librsvg2-bin libtiff-tools libtinfo5 \
            libtool libz-dev patch pkg-config python3 python3-setuptools xz-utils

      - name: Cache macOS depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/sdk-sources
          key: garlicoin-release-macos-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-release-macos-${{ runner.os }}-${{ env.HOST }}-

      - name: Fetch macOS SDK
        run: |
          mkdir -p depends/SDKs depends/sdk-sources
          sdk_archive="depends/sdk-sources/MacOSX${OSX_SDK_VERSION}.sdk.tar.gz"
          if [ ! -f "$sdk_archive" ]; then
            curl --location --fail \
              "${SDK_URL}/MacOSX${OSX_SDK_VERSION}.sdk.tar.gz" \
              -o "$sdk_archive"
          fi
          rm -rf "depends/SDKs/MacOSX${OSX_SDK_VERSION}.sdk"
          tar -C depends/SDKs -xf "$sdk_archive"
          test -d "depends/SDKs/MacOSX${OSX_SDK_VERSION}.sdk"

      - name: Prepare Darwin-only toolchain compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path('depends/packages/native_cctools.mk')
          text = native.read_text()
          old = "$(package)_cc=$($(package)_extract_dir)/toolchain/bin/clang\n$(package)_cxx=$($(package)_extract_dir)/toolchain/bin/clang++"
          new = "$(package)_cc=clang\n$(package)_cxx=clang++\n$(package)_cflags+=-fcommon"
          if old not in text:
              raise SystemExit('expected native_cctools compiler block not found')
          text = text.replace(old, new, 1)

          old = "define $(package)_preprocess_cmds\n  cd $($(package)_build_subdir); ./autogen.sh && \\\n  sed -i.old \"/define HAVE_PTHREADS/d\" ld64/src/ld/InputFiles.h"
          new = "define $(package)_preprocess_cmds\n  sed -i '/#include <sys\\/sysctl.h>/s/^/#ifdef __APPLE__\\n/; /#include <sys\\/sysctl.h>/a #endif' $($(package)_build_subdir)/libstuff/macosx_deployment_target.c && \\\n  sed -i 's/^#ifndef __CYGWIN__/#if !defined(__CYGWIN__) \\&\\& !defined(__linux__)/' $($(package)_build_subdir)/include/foreign/sys/sysctl.h && \\\n  cd $($(package)_build_subdir); ./autogen.sh && \\\n  sed -i.old \"/define HAVE_PTHREADS/d\" ld64/src/ld/InputFiles.h"
          if old not in text:
              raise SystemExit('expected native_cctools preprocess block not found')
          native.write_text(text.replace(old, new, 1))

          boost = Path('depends/packages/boost.mk')
          text = boost.read_text()
          old = './bootstrap.sh --without-icu --with-libraries=$($(package)_config_libraries) --with-toolset=$($(package)_toolset_$(host_os))'
          new = './bootstrap.sh --without-icu --with-libraries=$($(package)_config_libraries) $(if $(filter darwin,$(host_os)),--with-toolset=gcc,--with-toolset=$($(package)_toolset_$(host_os)))'
          if old not in text:
              raise SystemExit('expected Boost bootstrap line not found')
          boost.write_text(text.replace(old, new, 1))
          PY

      - name: Build deterministic macOS dependencies
        run: make ${MAKEJOBS} -C depends HOST="${HOST}"

      - name: Configure and build macOS release
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --prefix=/ \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench
          make ${MAKEJOBS}

      - name: Validate macOS install and Mach-O binaries
        run: |
          rm -rf release-stage release-package artifacts
          mkdir -p release-stage release-package/garlicoin-${VERSION} artifacts
          make install-strip DESTDIR="$PWD/release-stage"
          for binary in garlicoind garlicoin-cli garlicoin-qt; do
            test -f "release-stage/bin/${binary}"
            file "release-stage/bin/${binary}" | tee "/tmp/${binary}.file"
            grep -q 'Mach-O 64-bit x86_64' "/tmp/${binary}.file"
          done
          cp -a release-stage/. "release-package/garlicoin-${VERSION}/"
          cp README.md "release-package/garlicoin-${VERSION}/"
          tar -C release-package -czf "artifacts/garlicoin-${VERSION}-osx64.tar.gz" "garlicoin-${VERSION}"

      - name: Build and validate macOS DMG
        run: |
          make deploy
          dmg="$(find . -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          file "$dmg"
          cp "$dmg" "artifacts/garlicoin-${VERSION}-osx64.dmg"

      - name: Hash macOS artifacts
        run: |
          cd artifacts
          sha256sum * | tee SHA256SUMS

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x86_64
          path: artifacts/
          if-no-files-found: error
