name: Windows MinGW CI

on:
  push:
    branches:
      - master
      - preview/windows-highdpi-ci
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/**'
      - 'doc/build-windows.md'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/**'
      - 'doc/build-windows.md'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64-build:
    name: Windows x86_64 High-DPI preview
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      HOST: x86_64-w64-mingw32
      MAKEJOBS: -j2
      GARLICOIN_SCRYPT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply High-DPI initialization preview fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/qt/bitcoin.cpp')
          text = path.read_text()
          old = '''    BitcoinApplication app(argc, argv);
#if QT_VERSION > 0x050100
    // Generate high-dpi pixmaps
    QApplication::setAttribute(Qt::AA_UseHighDpiPixmaps);
#endif
#if QT_VERSION >= 0x050600
    QGuiApplication::setAttribute(Qt::AA_EnableHighDpiScaling);
#endif
#ifdef Q_OS_MAC
    QApplication::setAttribute(Qt::AA_DontShowIconsInMenus);
#endif
'''
          new = '''#if QT_VERSION > 0x050100
    // Qt application attributes must be set before QApplication is constructed.
    QApplication::setAttribute(Qt::AA_UseHighDpiPixmaps);
#endif
#if QT_VERSION >= 0x050600
    QGuiApplication::setAttribute(Qt::AA_EnableHighDpiScaling);
#endif
#ifdef Q_OS_MAC
    QApplication::setAttribute(Qt::AA_DontShowIconsInMenus);
#endif

    BitcoinApplication app(argc, argv);
'''
          if old not in text:
              raise SystemExit('Expected Qt initialization block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/qt/bitcoin.cpp

      - name: Install MinGW and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autotools-dev \
            bsdmainutils \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            file \
            g++-mingw-w64-x86-64 \
            git \
            gperf \
            libtool \
            mingw-w64-tools \
            patch \
            perl \
            pkg-config \
            python3

      - name: Select POSIX MinGW thread model
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version

      - name: Cache Windows depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-depends-windows-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-depends-windows-${{ runner.os }}-${{ env.HOST }}-
            garlicoin-release-windows-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic Windows dependencies
        run: make ${MAKEJOBS} -C depends HOST="${HOST}"

      - name: Configure Windows wallet and Qt GUI
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench

      - name: Build garlicoin-qt only
        run: make ${MAKEJOBS} src/qt/garlicoin-qt.exe

      - name: Verify Windows GUI binary
        run: |
          binary=src/qt/garlicoin-qt.exe
          test -f "$binary"
          description="$(file "$binary")"
          echo "$description"
          case "$description" in
            *"PE32+ executable"*"x86-64"*"MS Windows"*) ;;
            *) exit 1 ;;
          esac
          x86_64-w64-mingw32-objdump -f "$binary" | grep -q 'file format pei-x86-64'

      - name: Package Windows High-DPI preview
        run: |
          mkdir -p preview
          cp src/qt/garlicoin-qt.exe preview/
          cd preview
          sha256sum garlicoin-qt.exe > SHA256SUMS
          zip -X garlicoin-windows-highdpi-preview.zip garlicoin-qt.exe SHA256SUMS

      - name: Upload Windows High-DPI preview
        uses: actions/upload-artifact@v4
        with:
          name: garlicoin-windows-highdpi-preview
          path: preview/
          if-no-files-found: error
