name: Windows MinGW CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/**'
      - 'doc/build-windows.md'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/**'
      - 'doc/build-windows.md'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64-build:
    name: Windows x86_64 cross-build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      HOST: x86_64-w64-mingw32
      MAKEJOBS: -j2
      GARLICOIN_SCRYPT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autotools-dev \
            bsdmainutils \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            file \
            g++-mingw-w64-x86-64 \
            git \
            gperf \
            libtool \
            mingw-w64-tools \
            patch \
            perl \
            pkg-config \
            python3

      - name: Select POSIX MinGW thread model
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-g++ -v 2>&1 | tail -n 20

      - name: Cache Windows depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-depends-windows-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-depends-windows-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic Windows dependencies
        run: |
          mkdir -p ci-logs
          if make ${MAKEJOBS} -C depends HOST="${HOST}" >ci-logs/windows-depends.log 2>&1; then
            tail -n 30 ci-logs/windows-depends.log
          else
            tail -n 250 ci-logs/windows-depends.log
            exit 1
          fi

      - name: Configure Windows wallet and Qt GUI
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench

      - name: Build Windows executables
        run: |
          if make ${MAKEJOBS} -C src >ci-logs/windows-build.log 2>&1; then
            tail -n 30 ci-logs/windows-build.log
          else
            tail -n 250 ci-logs/windows-build.log
            exit 1
          fi

      - name: Verify Windows binaries
        run: |
          test -f src/garlicoind.exe
          test -f src/garlicoin-cli.exe
          test -f src/qt/garlicoin-qt.exe
          file src/garlicoind.exe
          file src/garlicoin-cli.exe
          file src/qt/garlicoin-qt.exe

      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-build-logs
          path: ci-logs/
          if-no-files-found: ignore
