name: macOS legacy deterministic cross-build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-cross-build:
    name: macOS x86_64 legacy cross-build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      HOST: x86_64-apple-darwin14
      OSX_SDK_VERSION: '10.11'
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
      MAKEJOBS: -j2
      GARLICOIN_SCRYPT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Legacy workflow notice
        run: |
          echo 'This Linux-to-Darwin workflow is retained for historical/manual investigation only.'
          echo 'The supported Qt 5.15.19 macOS validation path is the native Intel macOS workflow.'

      - name: Install Darwin cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autotools-dev \
            bsdmainutils \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cmake \
            curl \
            git \
            imagemagick \
            libbz2-dev \
            libcap-dev \
            librsvg2-bin \
            libtiff-tools \
            libtinfo5 \
            libtool \
            libz-dev \
            patch \
            pkg-config \
            python3 \
            python3-setuptools \
            xz-utils
          clang --version
          clang++ --version

      - name: Cache macOS depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/sdk-sources
          key: garlicoin-depends-macos-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-depends-macos-${{ runner.os }}-${{ env.HOST }}-

      - name: Fetch macOS SDK
        run: |
          mkdir -p depends/SDKs depends/sdk-sources
          sdk_archive="depends/sdk-sources/MacOSX${OSX_SDK_VERSION}.sdk.tar.gz"
          if [ ! -f "$sdk_archive" ]; then
            curl --location --fail \
              "${SDK_URL}/MacOSX${OSX_SDK_VERSION}.sdk.tar.gz" \
              -o "$sdk_archive"
          fi
          rm -rf "depends/SDKs/MacOSX${OSX_SDK_VERSION}.sdk"
          tar -C depends/SDKs -xf "$sdk_archive"
          test -d "depends/SDKs/MacOSX${OSX_SDK_VERSION}.sdk"

      - name: Prepare Darwin-only toolchain compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path('depends/packages/native_cctools.mk')
          text = native.read_text()
          old = "$(package)_cc=$($(package)_extract_dir)/toolchain/bin/clang\n$(package)_cxx=$($(package)_extract_dir)/toolchain/bin/clang++"
          new = "$(package)_cc=clang\n$(package)_cxx=clang++\n$(package)_cflags+=-fcommon"
          if old not in text:
              raise SystemExit('expected native_cctools compiler block not found')
          text = text.replace(old, new, 1)

          old = "define $(package)_preprocess_cmds\n  cd $($(package)_build_subdir); ./autogen.sh && \\\n  sed -i.old \"/define HAVE_PTHREADS/d\" ld64/src/ld/InputFiles.h"
          new = "define $(package)_preprocess_cmds\n  sed -i '/#include <sys\\/sysctl.h>/s/^/#ifdef __APPLE__\\n/; /#include <sys\\/sysctl.h>/a #endif' $($(package)_build_subdir)/libstuff/macosx_deployment_target.c && \\\n  sed -i 's/^#ifndef __CYGWIN__/#if !defined(__CYGWIN__) \\&\\& !defined(__linux__)/' $($(package)_build_subdir)/include/foreign/sys/sysctl.h && \\\n  cd $($(package)_build_subdir); ./autogen.sh && \\\n  sed -i.old \"/define HAVE_PTHREADS/d\" ld64/src/ld/InputFiles.h"
          if old not in text:
              raise SystemExit('expected native_cctools preprocess block not found')
          native.write_text(text.replace(old, new, 1))

          boost = Path('depends/packages/boost.mk')
          text = boost.read_text()
          old = './bootstrap.sh --without-icu --with-libraries=$($(package)_config_libraries) --with-toolset=$($(package)_toolset_$(host_os))'
          new = './bootstrap.sh --without-icu --with-libraries=$($(package)_config_libraries) $(if $(filter darwin,$(host_os)),--with-toolset=gcc,--with-toolset=$($(package)_toolset_$(host_os)))'
          if old not in text:
              raise SystemExit('expected Boost bootstrap line not found')
          boost.write_text(text.replace(old, new, 1))
          PY

      - name: Build deterministic macOS dependencies
        run: |
          mkdir -p ci-logs
          if make ${MAKEJOBS} -C depends HOST="${HOST}" >ci-logs/macos-depends.log 2>&1; then
            tail -n 30 ci-logs/macos-depends.log
          else
            tail -n 250 ci-logs/macos-depends.log
            config_log=$(find depends/work/build -path '*native_cctools*' -name config.log -print -quit)
            if [ -n "$config_log" ]; then
              cp "$config_log" ci-logs/native-cctools-config.log
              echo '--- native_cctools config.log ---'
              tail -n 200 "$config_log"
            fi
            boost_log=$(find depends/work/build -path '*boost*' -name bootstrap.log -print -quit)
            if [ -n "$boost_log" ]; then
              cp "$boost_log" ci-logs/boost-bootstrap.log
              echo '--- Boost bootstrap.log ---'
              tail -n 200 "$boost_log"
            fi
            exit 1
          fi

      - name: Configure macOS wallet and Qt GUI
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --enable-wallet \
              --with-gui=qt5 \
              --disable-tests \
              --disable-bench

      - name: Build macOS executables
        run: |
          if make ${MAKEJOBS} -C src >ci-logs/macos-build.log 2>&1; then
            tail -n 30 ci-logs/macos-build.log
          else
            tail -n 250 ci-logs/macos-build.log
            exit 1
          fi

      - name: Verify macOS binaries
        run: |
          test -f src/garlicoind
          test -f src/garlicoin-cli
          test -f src/qt/garlicoin-qt
          file src/garlicoind | tee /tmp/garlicoind.file
          file src/garlicoin-cli | tee /tmp/garlicoin-cli.file
          file src/qt/garlicoin-qt | tee /tmp/garlicoin-qt.file
          grep -q 'Mach-O 64-bit x86_64' /tmp/garlicoind.file
          grep -q 'Mach-O 64-bit x86_64' /tmp/garlicoin-cli.file
          grep -q 'Mach-O 64-bit x86_64' /tmp/garlicoin-qt.file

      - name: Upload macOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-darwin-build-logs
          path: ci-logs/
          if-no-files-found: ignore
