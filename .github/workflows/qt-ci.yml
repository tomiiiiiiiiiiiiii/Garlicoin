name: Qt GUI CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/Makefile'
      - 'depends/funcs.mk'
      - 'depends/config.site.in'
      - 'depends/packages/packages.mk'
      - 'depends/packages/qt.mk'
      - 'depends/patches/qt/**'
      - 'depends/packages/expat.mk'
      - 'depends/packages/dbus.mk'
      - 'depends/packages/freetype.mk'
      - 'depends/packages/fontconfig.mk'
      - 'depends/packages/libxcb.mk'
      - 'depends/packages/xcb_proto.mk'
      - 'depends/packages/libXau.mk'
      - 'depends/packages/libX11.mk'
      - 'depends/packages/xproto.mk'
      - 'depends/packages/xextproto.mk'
      - 'depends/packages/libXext.mk'
      - 'depends/packages/xtrans.mk'
      - 'depends/packages/qrencode.mk'
      - 'depends/packages/protobuf.mk'
      - 'depends/packages/native_protobuf.mk'
      - 'depends/packages/zlib.mk'
      - 'depends/packages/openssl.mk'
      - 'depends/packages/bdb.mk'
      - '.github/workflows/qt-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'configure.ac'
      - 'build-aux/**'
      - 'depends/Makefile'
      - 'depends/funcs.mk'
      - 'depends/config.site.in'
      - 'depends/packages/packages.mk'
      - 'depends/packages/qt.mk'
      - 'depends/patches/qt/**'
      - 'depends/packages/expat.mk'
      - 'depends/packages/dbus.mk'
      - 'depends/packages/freetype.mk'
      - 'depends/packages/fontconfig.mk'
      - 'depends/packages/libxcb.mk'
      - 'depends/packages/xcb_proto.mk'
      - 'depends/packages/libXau.mk'
      - 'depends/packages/libX11.mk'
      - 'depends/packages/xproto.mk'
      - 'depends/packages/xextproto.mk'
      - 'depends/packages/libXext.mk'
      - 'depends/packages/xtrans.mk'
      - 'depends/packages/qrencode.mk'
      - 'depends/packages/protobuf.mk'
      - 'depends/packages/native_protobuf.mk'
      - 'depends/packages/zlib.mk'
      - 'depends/packages/openssl.mk'
      - 'depends/packages/bdb.mk'
      - '.github/workflows/qt-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-wallet-build:
    name: Qt GUI + wallet build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      HOST: x86_64-unknown-linux-gnu
      MAKEJOBS: -j2
      GARLICOIN_SCRYPT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autotools-dev \
            bsdmainutils \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            git \
            gperf \
            libtool \
            patch \
            perl \
            pkg-config \
            python3

      - name: Cache Qt and wallet depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-depends-qt-wallet-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-depends-qt-wallet-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic Qt 5.9.7 and Berkeley DB 4.8 dependencies
        run: |
          mkdir -p ci-logs
          if make ${MAKEJOBS} -C depends \
            HOST="${HOST}" \
            NO_UPNP=1 >ci-logs/qt-depends.log 2>&1; then
            tail -n 20 ci-logs/qt-depends.log
          else
            tail -n 200 ci-logs/qt-depends.log
            exit 1
          fi

      - name: Configure Qt GUI with wallet enabled
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --enable-wallet \
              --with-gui=qt5 \
              --without-miniupnpc \
              --disable-zmq \
              --enable-sse2 \
              --disable-tests \
              --disable-bench

      - name: Build garlicoin-qt
        run: |
          if make ${MAKEJOBS} -C src bitcoin_qt >ci-logs/qt-build.log 2>&1; then
            tail -n 20 ci-logs/qt-build.log
          else
            tail -n 200 ci-logs/qt-build.log
            exit 1
          fi

      - name: Verify GUI binary
        run: |
          test -x src/qt/garlicoin-qt
          file src/qt/garlicoin-qt

      - name: Upload Qt build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-build-logs
          path: ci-logs/
          if-no-files-found: ignore
