name: One-off runtime branding cleanup

on:
  push:
    branches:
      - maintenance/release-validation
    paths:
      - '.github/workflows/branding-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/release-validation
          fetch-depth: 0

      - name: Clean runtime-facing stale binary names
        shell: bash
        run: |
          set -euo pipefail

          files=(
            configure.ac
            src/bitcoin-cli.cpp
            src/rpc/mining.cpp
            src/rpc/misc.cpp
            src/wallet/rpcdump.cpp
            src/wallet/test/wallet_tests.cpp
          )

          for file in "${files[@]}"; do
            perl -pi -e 's/litecoind/garlicoind/g; s/litecoin-cli/garlicoin-cli/g' "$file"
          done

          git diff --check

          if git grep -ni -i 'litecoin' -- 'src/qt/locale/*.ts'; then
            echo 'ERROR: stale Litecoin branding remains in Qt translations.' >&2
            exit 1
          fi

          grep -F 'define(_CLIENT_VERSION_MAJOR, 0)' configure.ac
          grep -F 'define(_CLIENT_VERSION_MINOR, 18)' configure.ac
          grep -F 'define(_CLIENT_VERSION_REVISION, 1)' configure.ac
          grep -F 'define(_CLIENT_VERSION_BUILD, 0)' configure.ac

          echo 'Remaining live-source references for review:'
          git grep -ni -i 'litecoin' -- \
            'configure.ac' \
            'src/*.cpp' \
            'src/*.h' \
            'src/rpc/*.cpp' \
            'src/wallet/*.cpp' \
            ':!src/bitcoin.diff' || true

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configure.ac src/bitcoin-cli.cpp src/rpc/mining.cpp src/rpc/misc.cpp src/wallet/rpcdump.cpp src/wallet/test/wallet_tests.cpp
          git diff --cached --check
          git commit -m 'release: remove stale Litecoin names from runtime text'
          git push origin HEAD:maintenance/release-validation
