name: One-off branding cleanup

on:
  push:
    branches:
      - maintenance/release-validation
    paths:
      - '.github/workflows/branding-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/release-validation
          fetch-depth: 0

      - name: Replace stale Litecoin branding in Qt translations
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            perl -pi -e 's/LITECOIN/GARLICOIN/g; s/Litecoin/Garlicoin/g; s/litecoin/garlicoin/g' "$file"
          done < <(git grep -Ilz -i 'litecoin' -- 'src/qt/locale/*.ts')

          if git grep -ni -i 'litecoin' -- 'src/qt/locale/*.ts'; then
            echo 'ERROR: stale Litecoin branding remains in Qt translations.' >&2
            exit 1
          fi

      - name: Set client version to 0.18.1
        shell: bash
        run: |
          set -euo pipefail

          perl -0pi -e 's/define\(_CLIENT_VERSION_REVISION, 0\)/define(_CLIENT_VERSION_REVISION, 1)/' configure.ac

          grep -F 'define(_CLIENT_VERSION_MAJOR, 0)' configure.ac
          grep -F 'define(_CLIENT_VERSION_MINOR, 18)' configure.ac
          grep -F 'define(_CLIENT_VERSION_REVISION, 1)' configure.ac
          grep -F 'define(_CLIENT_VERSION_BUILD, 0)' configure.ac

      - name: Validate and show remaining repository references
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo 'Remaining case-insensitive Litecoin references outside translations:'
          if ! git grep -ni -i 'litecoin' -- ':!src/qt/locale/*.ts'; then
            echo 'None.'
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configure.ac src/qt/locale
          git diff --cached --check
          git commit -m 'release: fix Garlicoin branding and set version 0.18.1'
          git push origin HEAD:maintenance/release-validation
