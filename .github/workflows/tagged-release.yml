name: Tagged Release Publisher

on:
  create:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-and-publish:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event_name == 'create' && github.event.ref || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_TAG#release/}"
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#v}"
          test -f "doc/release-notes-${VERSION}.md"

          MAJOR="$(sed -n 's/^define(_CLIENT_VERSION_MAJOR, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          MINOR="$(sed -n 's/^define(_CLIENT_VERSION_MINOR, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          REVISION="$(sed -n 's/^define(_CLIENT_VERSION_REVISION, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          BUILD="$(sed -n 's/^define(_CLIENT_VERSION_BUILD, \([0-9][0-9]*\))$/\1/p' configure.ac)"
          test "${MAJOR}.${MINOR}.${REVISION}" = "$VERSION"
          test "$BUILD" = "0"

          TARGET_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = create ]; then
            # A release/vX.Y.Z branch requests publication through the same exact-tag gate.
            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
              test "$tag_sha" = "$TARGET_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$TARGET_SHA"
            fi
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$TARGET_SHA"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Dispatch exact-tag release validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-validation-ci.yml --ref "$RELEASE_TAG"

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --workflow release-validation-ci.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headBranch,headSha \
              --jq ".[] | select(.headBranch == \"$RELEASE_TAG\" and .headSha == \"$TARGET_SHA\") | .databaseId" \
              | head -n1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          test -n "$RUN_ID"
          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Release validation run: $RUN_ID"

      - name: Wait for release validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run watch "$RELEASE_RUN_ID" --exit-status

      - name: Download Linux release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-linux-x86_64 -D release-input/linux

      - name: Download Windows release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-windows-x86_64 -D release-input/windows

      - name: Download macOS release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download "$RELEASE_RUN_ID" -n release-macos-x86_64 -D release-input/macos

      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp "release-input/linux/garlicoin-${VERSION}-linux-x86_64.tar.gz" release-assets/
          cp "release-input/linux/garlicoin-${VERSION}.tar.gz" release-assets/
          cp "release-input/windows/garlicoin-${VERSION}-win64.zip" release-assets/
          cp "release-input/windows/garlicoin-${VERSION}-win64-setup.exe" release-assets/
          cp "release-input/macos/garlicoin-${VERSION}-osx64.tar.gz" release-assets/
          cp "release-input/macos/garlicoin-${VERSION}-osx64.dmg" release-assets/

          (
            cd release-assets
            sha256sum garlicoin-* | sort -k2 > SHA256SUMS
          )

          rm -rf /tmp/grlc-release-check
          mkdir -p /tmp/grlc-release-check
          tar -xzf "release-assets/garlicoin-${VERSION}-linux-x86_64.tar.gz" -C /tmp/grlc-release-check
          FIRST_LINE="$(/tmp/grlc-release-check/garlicoin-${VERSION}/bin/garlicoind --version | head -n1)"
          echo "$FIRST_LINE"
          test "$FIRST_LINE" = "Garlicoin Core Daemon version v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="doc/release-notes-${VERSION}.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Garlicoin Core ${VERSION} - GRLC.eu Maintenance Release" \
              --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --title "Garlicoin Core ${VERSION} - GRLC.eu Maintenance Release" \
              --notes-file "$NOTES"
          fi
