name: Network Depends CI

on:
  push:
    branches:
      - master
    paths:
      - 'depends/packages/miniupnpc.mk'
      - 'depends/patches/miniupnpc/**'
      - 'depends/packages/zeromq.mk'
      - 'depends/patches/zeromq/**'
      - 'depends/packages/packages.mk'
      - 'depends/Makefile'
      - 'depends/funcs.mk'
      - '.github/workflows/upnp-depends-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'depends/packages/miniupnpc.mk'
      - 'depends/patches/miniupnpc/**'
      - 'depends/packages/zeromq.mk'
      - 'depends/patches/zeromq/**'
      - 'depends/packages/packages.mk'
      - 'depends/Makefile'
      - 'depends/funcs.mk'
      - '.github/workflows/upnp-depends-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-depends-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-network-depends:
    name: Build with MiniUPnPc and ZeroMQ
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      HOST: x86_64-unknown-linux-gnu
      MAKEJOBS: -j2
      GARLICOIN_SCRYPT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autotools-dev \
            bsdmainutils \
            build-essential \
            ca-certificates \
            curl \
            libtool \
            pkg-config \
            python3

      - name: Cache network depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: garlicoin-depends-network-${{ runner.os }}-${{ env.HOST }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            garlicoin-depends-network-${{ runner.os }}-${{ env.HOST }}-

      - name: Build deterministic dependencies with MiniUPnPc and ZeroMQ
        run: |
          make ${MAKEJOBS} -C depends \
            HOST="${HOST}" \
            NO_QT=1 \
            NO_WALLET=1

      - name: Configure with UPnP and ZMQ enabled
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" \
            ./configure \
              --disable-wallet \
              --without-gui \
              --with-miniupnpc \
              --enable-zmq \
              --enable-sse2 \
              --disable-tests \
              --disable-bench

      - name: Build daemon with network dependencies
        run: |
          make ${MAKEJOBS} -C src garlicoind

      - name: Verify daemon binary
        run: |
          test -x src/garlicoind
          src/garlicoind -version
