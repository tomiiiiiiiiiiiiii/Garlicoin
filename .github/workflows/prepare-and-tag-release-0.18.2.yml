name: Prepare and tag Garlicoin Core 0.18.2

on:
  push:
    branches:
      - release/0.18.2

permissions:
  contents: write

jobs:
  prepare-and-tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.18.2
          fetch-depth: 0

      - name: Enable tagged release publication
        env:
          PUBLISH_B64: 
          NOTES_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          workflow = Path('.github/workflows/release-validation-ci.yml')
          text = workflow.read_text()

          trigger_old = "on:\n  pull_request:"
          trigger_new = "on:\n  push:\n    tags:\n      - 'v*'\n  pull_request:"
          if trigger_old in text:
              text = text.replace(trigger_old, trigger_new, 1)
          elif "    tags:\n      - 'v*'" not in text:
              raise SystemExit('could not add tag trigger')

          if '  publish-release:\n' not in text:
              text = text.rstrip() + '\n\n' + base64.b64decode(os.environ['PUBLISH_B64']).decode().rstrip() + '\n'

          workflow.write_text(text)
          Path('doc/release-notes-0.18.2.md').write_bytes(base64.b64decode(os.environ['NOTES_B64']))
          Path('.github/workflows/prepare-and-tag-release-0.18.2.yml').unlink()
          PY

      - name: Commit clean release automation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: enable tagged 0.18.2 publication'
          git push origin HEAD:release/0.18.2

      - name: Create and push v0.18.2 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.18.2 >/dev/null 2>&1; then
            echo 'Tag v0.18.2 already exists; refusing to move it.'
            exit 1
          fi
          git tag -a v0.18.2 -m 'Garlicoin Core 0.18.2 - GRLC.eu Maintenance Release'
          git push origin v0.18.2
