name: P2P framework CI
on:
  pull_request:
    paths:
      - 'test/functional/**'
      - '.github/workflows/p2p-framework-ci.yml'
  push:
    branches: [master]
    paths:
      - 'test/functional/**'
      - '.github/workflows/p2p-framework-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing PoW test dependency
        run: python -m pip install litecoin-scrypt==1.0.2
      - name: Validate transport and compile framework
        run: |
          PYTHONPATH=test/functional python -m unittest test_framework.test_mininode -v
          python -m compileall -q test/functional/test_framework
