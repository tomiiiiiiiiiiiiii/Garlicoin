name: Dispatch v0.18.2 tagged release once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dispatch-v0.18.2-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch tagged release publisher from master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run tagged-release.yml --repo tomiiiiiiiiiiiiii/Garlicoin --ref master -f release_tag=v0.18.2
