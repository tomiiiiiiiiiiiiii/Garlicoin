name: One-shot 0.18.3 version bump

on:
  push:
    branches:
      - maintenance/qt515-openssl35
    paths:
      - '.github/workflows/bump-0183.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/qt515-openssl35
          fetch-depth: 0

      - name: Bump configure.ac to 0.18.3
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'define(_CLIENT_VERSION_MAJOR, 0)' configure.ac
          grep -qx 'define(_CLIENT_VERSION_MINOR, 18)' configure.ac
          grep -qx 'define(_CLIENT_VERSION_REVISION, 2)' configure.ac
          grep -qx 'define(_CLIENT_VERSION_BUILD, 0)' configure.ac
          sed -i 's/^define(_CLIENT_VERSION_REVISION, 2)$/define(_CLIENT_VERSION_REVISION, 3)/' configure.ac
          git diff --check
          test "$(git diff --numstat -- configure.ac | awk '{print $1 ":" $2}')" = '1:1'
          grep -qx 'define(_CLIENT_VERSION_REVISION, 3)' configure.ac

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configure.ac
          git commit -m 'build: bump version to 0.18.3'
          git push origin HEAD:maintenance/qt515-openssl35
